name: Pull Request

on:
  pull_request:
    branches: [main]

# Default to no permissions; the job widens only what it needs.
permissions: {}

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Guard against local-dev lockfile versions
        run: |
          if grep -rln '"resolved": "1.99.99"' --include=packages.lock.json . ; then
            echo "::error::A packages.lock.json contains the local-dev version 1.99.99. Regenerate lockfiles in CI mode (remove trax-local.props) before committing."
            exit 1
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          directory: ./TestResults
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ADRs for this repo live in docs/adr/ and are checked against this checkout alone. The
  # guard is published by Trax.Docs; nothing else needs to be cloned.
  #
  # REPIN REQUIRED: 6d5e3c4bffe4 is a commit on Trax.Docs' feat/adr-system branch. It is pushed,
  # so this job resolves, but it runs the pre-merge guard. Merge Trax.Docs first, then repoint
  # this at the resulting commit on Trax.Docs main.
  #
  # Repinning is not optional, and forgetting it does not fail loudly. An ordinary merge
  # leaves this SHA reachable, so the job goes on passing while running the pre-merge guard
  # for ever. Only a SHA that has become unreachable gives "action not found".
  adr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Check ADRs
        uses: TraxSharp/Trax.Docs/.github/actions/adr-guard@6d5e3c4bffe45315f908fa44e5c065b96866b241
        with:
          known-areas: platform,testing,packaging
          census-root: tests/Trax.Core.Tests.Meta
